name: oficina-limpa
# "Assume nothing" install test: machines stripped of developer tools, NON-ADMIN participant,
# running oficina/preparar.* exactly as the guide says. Each job records what existed before,
# what preparar installed, and checks that a second run installs nothing.
on:
  push:
    branches: [oficina-testes]
    paths: ['oficina/preparar.*', 'oficina/testes/limpo-*', '.github/workflows/oficina-limpa.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2025
            conta: chatgpt
          - image: windows-2022
            conta: claude
    runs-on: ${{ matrix.image }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Windows sem ferramentas, aluno sem admin
        shell: pwsh
        run: ./oficina/testes/limpo-win-orquestrar.ps1 -Variant limpo -Conta ${{ matrix.conta }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.image }}-limpo
          path: C:\oficina\out

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-zerado
            conta: chatgpt
            image: ubuntu:24.04
            sudo: "yes"
            base: "apt-get update -qq && apt-get install -y -qq sudo wget ca-certificates xz-utils bzip2 >/dev/null"
          - name: ubuntu-ja-tem-git-curl
            conta: claude
            image: ubuntu:24.04
            sudo: "yes"
            base: "apt-get update -qq && apt-get install -y -qq sudo wget ca-certificates xz-utils bzip2 git curl libatomic1 >/dev/null"
          - name: ubuntu-sem-senha-queda-de-rede
            conta: chatgpt
            image: ubuntu:24.04
            sudo: "no"
            base: "apt-get update -qq && apt-get install -y -qq sudo wget ca-certificates xz-utils bzip2 libatomic1 >/dev/null"
          - name: fedora-zerado
            conta: chatgpt
            image: fedora:41
            sudo: "yes"
            base: "dnf install -y -q sudo wget xz bzip2 >/dev/null"
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: |
          set +e
          mkdir -p out; chmod 777 out
          cat > out/dentro.sh <<'EOF'
          set -e
          ${{ matrix.base }}
          useradd -m -s /bin/bash aluno
          if [ "${{ matrix.sudo }}" = yes ]; then echo "aluno ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/aluno; fi
          cd /home/aluno && sudo -u aluno -H bash /t/limpo-posix.sh /out ${{ matrix.name }} ${{ github.sha }} ${{ matrix.conta }}
          EOF
          docker run --name aluno-pc -v "$PWD/oficina/testes:/t:ro" -v "$PWD/out:/out" ${{ matrix.image }} bash /out/dentro.sh > out/container.txt 2>&1 &
          CPID=$!
          if [ "${{ matrix.name }}" = ubuntu-sem-senha-queda-de-rede ]; then
            # Drop the container's network for 90 s once the Hermes install has started.
            for i in $(seq 1 600); do grep -qs 'Instalando o Hermes' out/*preparar_1.log && break; sleep 3; done
            sleep 20
            docker network disconnect bridge aluno-pc && echo "queda_inicio=$(date +%T)" > out/queda.txt
            sleep 90
            docker network connect bridge aluno-pc && echo "queda_fim=$(date +%T)" >> out/queda.txt
          fi
          wait $CPID; echo "container exit $?"
          tail -30 out/container.txt
          cat out/*steps.txt; echo; cat out/*inventario-antes.txt; echo; cat out/queda.txt 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: out

  macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Mac sem ferramentas da Apple, aluno padrao, queda de rede
        run: |
          set -x
          OUT=/tmp/oficina/out; mkdir -p $OUT; chmod 777 /tmp/oficina $OUT
          cp oficina/testes/limpo-posix.sh /tmp/oficina/; chmod 755 /tmp/oficina/limpo-posix.sh
          # Hide every developer toolchain the runner image ships.
          sudo mv /Library/Developer/CommandLineTools /Library/Developer/CLT.hidden || true
          sudo mkdir -p /Applications/.hidden
          for x in /Applications/Xcode*.app; do sudo mv "$x" /Applications/.hidden/ || true; done
          sudo xcode-select --reset || true
          /usr/bin/git --version && echo "GIT STILL WORKS" || echo "git unavailable (as on a fresh Mac)"
          PW="Mf$(uuidgen | tr -d - | cut -c1-14)z9"
          sudo sysadminctl -addUser aluno -password "$PW" -home /Users/aluno
          sudo createhomedir -c -u aluno || true
          rx() { netstat -ibn | awk '$1=="en0" && $3 ~ /Link/ {print $7; exit}'; }
          # Drop the student's network for 90 s once the Hermes install has started (pf, per user).
          (
            until grep -qs 'Instalando o Hermes' $OUT/mac-limpo-preparar_1.log; do sleep 3; done
            sleep 20
            echo 'block drop out quick proto { tcp, udp } from any to any user aluno' > /tmp/queda.pf
            sudo pfctl -E 2>/dev/null; sudo pfctl -f /tmp/queda.pf 2>&1 | tail -1
            echo "queda_inicio=$(date +%T)" > $OUT/queda.txt
            sleep 5; sudo -u aluno curl -sI --max-time 10 https://github.com >/dev/null && echo "queda_efetiva=False" >> $OUT/queda.txt || echo "queda_efetiva=True" >> $OUT/queda.txt
            sleep 85
            sudo pfctl -f /etc/pf.conf 2>/dev/null; echo "queda_fim=$(date +%T)" >> $OUT/queda.txt
          ) &
          r0=$(rx); t0=$(date +%s)
          sudo -u aluno -H env -i HOME=/Users/aluno USER=aluno LOGNAME=aluno TERM=dumb \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin bash /tmp/oficina/limpo-posix.sh $OUT mac-limpo ${{ github.sha }} claude
          echo "download_mb_total=$(( ($(rx)-r0)/1048576 )) wall_min=$(( ($(date +%s)-t0)/60 ))" > $OUT/meta-mac-limpo.txt
          wait || true
          cat $OUT/*steps.txt $OUT/meta-*.txt $OUT/queda.txt $OUT/*inventario-antes.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-limpo
          path: /tmp/oficina/out

  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Mac Intel deve parar com aviso, sem baixar nada
        run: |
          set +e
          mkdir -p out
          curl -fsSL https://raw.githubusercontent.com/Rafaelrr5/minds-hermes/${{ github.sha }}/oficina/preparar.sh | bash > out/mac-intel-preparar.log 2>&1
          echo "exit=$?" >> out/mac-intel-preparar.log
          if [ -e ~/.hermes/hermes-agent ]; then echo "INSTALLED SOMETHING" >> out/mac-intel-preparar.log; else echo "nothing installed" >> out/mac-intel-preparar.log; fi
          cat out/mac-intel-preparar.log
          grep -q 'processador Intel' out/mac-intel-preparar.log && grep -q 'nothing installed' out/mac-intel-preparar.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel
          path: out

  collect:
    if: always()
    needs: [windows, linux, macos, mac-intel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: resultados
      - run: |
          cd resultados
          git init -q -b oficina-resultados-limpo
          git config user.name "oficina-ci"; git config user.email "oficina-ci@users.noreply.github.com"
          echo "run ${{ github.run_id }} sha ${{ github.sha }} $(date -u +%FT%TZ)" > RUN.txt
          git add -A && git commit -qm "resultados limpos run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" oficina-resultados-limpo
